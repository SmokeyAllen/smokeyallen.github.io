<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beginning of the Homelab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display:ital@0;1&family=DM+Mono&display=swap" rel="stylesheet" />
  <!-- One level up since posts/ is a subfolder -->
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" type="image/png" href="../favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="shortcut icon" href="../favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
  <link rel="manifest" href="../site.webmanifest" />

  <style>
    .post-hero {
      padding: 4rem 0 3rem;
      border-bottom: 1px solid var(--color-border);
      max-width: 720px;
    }

    .post-hero .eyebrow { display: block; margin-bottom: 1rem; }

    .post-hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin-bottom: 1.25rem;
      line-height: 1.1;
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .post-date {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }

    .post-tag {
      display: inline-block;
      padding: 3px 10px;
      background: var(--color-tag-bg);
      color: var(--color-tag-text);
      font-size: 0.72rem;
      font-weight: 500;
      border-radius: var(--radius-full);
    }

    body.dark .post-tag {
      background: var(--color-tag-bg);
      color: var(--color-tag-text);
    }

    .post-read-time {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-text-muted);
    }

    /* Article body */
    .post-body {
      max-width: 720px;
      padding: 3rem 0 5rem;
    }

    .post-body p {
      margin-bottom: 1.5rem;
      font-size: 1rem;
      line-height: 1.85;
      color: var(--color-text-secondary);
    }

    .post-body h2 {
      font-size: clamp(1.3rem, 2.5vw, 1.8rem);
      margin: 2.5rem 0 1rem;
      font-weight: 400;
    }

    .post-body h3 {
      font-size: 1.05rem;
      font-weight: 600;
      font-family: var(--font-sans);
      margin: 2rem 0 0.75rem;
      color: var(--color-text-primary);
    }

    .post-body ul,
    .post-body ol {
      padding-left: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .post-body li {
      color: var(--color-text-secondary);
      font-size: 1rem;
      line-height: 1.8;
      margin-bottom: 0.4rem;
    }

    .post-body code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: 3px;
      padding: 1px 5px;
      color: var(--color-text-primary);
    }

    body.dark .post-body code { background: #1a1a18; }

    .post-body pre {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      overflow-x: auto;
      margin-bottom: 1.5rem;
    }

    body.dark .post-body pre { background: #1a1a18; }

    .post-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.85rem;
      line-height: 1.7;
    }

    .post-body blockquote {
      border-left: 3px solid var(--color-border);
      padding-left: 1.25rem;
      margin: 1.5rem 0;
      color: var(--color-text-muted);
      font-style: italic;
    }

    .post-divider {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 2.5rem 0;
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--color-text-muted);
      text-decoration: none;
      padding: 1.25rem 0;
      transition: color 0.15s;
    }

    .back-link:hover { color: var(--color-text-primary); }
  </style>
</head>
<body>

  <div id="site-header"></div>

  <main>
    <div class="container">

      <a href="../blog.html" class="back-link">← Back to blog</a>

      <!-- Post header -->
      <div class="post-hero">
        <span class="eyebrow">Blog</span>
        <h1>Test Article</h1>
        <div class="post-meta">
          <span class="post-date">24 Jun 2026</span>
          <span class="post-tag">Linux</span>
          <span class="post-read-time">4 min read</span>
        </div>
      </div>

      <!-- Post content -->
      <article class="post-body">

        <p>
          Test
        </p>

        <h2>Test title</h2>

        <p>
          Test
        </p>

        <p>
          Test
        </p>

        <h2>Test title</h2>

        <p>
          Test
        </p>

        <pre><code>Test code</code></pre>

        <p>
          Test
        </p>

        <h2>Test title</h2>

        <ul>
          <li>Test bullet</li>
          <li>Test bullet</li>
          <li>Test bullet</li>
          <li>Test bullet</li>
          <li>Test bullet</li>
        </ul>

        <h2>Test title</h2>

        <p>
          Test
          <code>Test inline code</code> Test
        </p>

        <hr class="post-divider" />

        <p>
          Test
        </p>

      </article>

    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../css/layout.js"></script>

</body>
</html>
