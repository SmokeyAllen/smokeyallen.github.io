<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — SmokeyAllen</title>
  <meta name="description" content="Get in touch with Smokey Allen." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display:ital@0;1&family=DM+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    .contact-header {
      padding: 5rem 0 3.5rem;
      border-bottom: 1px solid var(--color-border);
    }

    .contact-header .eyebrow { display: block; margin-bottom: 1rem; }
    .contact-header h1 { font-size: clamp(2rem, 5vw, 3.5rem); }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6rem;
      padding: 5rem 0;
      align-items: start;
    }

    /* ── Left: details ── */
    .contact-details h2 {
      font-size: clamp(1.4rem, 3vw, 2rem);
      margin-bottom: 1rem;
    }

    .contact-details p {
      max-width: 360px;
      margin-bottom: 2.5rem;
    }

    .contact-method {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--color-border);
      text-decoration: none;
      transition: opacity var(--transition);
    }

    .contact-method:first-of-type { border-top: 1px solid var(--color-border); }
    .contact-method:hover { opacity: 0.6; }

    .contact-method-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-method-icon svg {
      width: 16px;
      height: 16px;
      stroke: var(--color-text-secondary);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .contact-method-label {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .contact-method-label span:first-child {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .contact-method-label span:last-child {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--color-text-primary);
    }

    .contact-method-arrow {
      margin-left: auto;
      color: var(--color-text-muted);
      font-size: 1.1rem;
    }

    /* ── Right: form ── */
    .contact-form-wrap h2 {
      font-size: clamp(1.4rem, 3vw, 2rem);
      margin-bottom: 2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }

    .form-group label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-text-primary);
      transition: border-color var(--transition), background var(--transition);
      outline: none;
      resize: none;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--color-text-muted);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--color-text-muted);
      background: var(--color-bg);
    }

    body.dark .form-group input,
    body.dark .form-group textarea {
      background: #1a1a18;
      border-color: var(--color-border);
      color: var(--color-text-primary);
    }

    body.dark .form-group input:focus,
    body.dark .form-group textarea:focus {
      border-color: #4a4845;
      background: #111110;
    }

    .form-group textarea { height: 140px; }

    .form-status {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      margin-top: 1rem;
      display: none;
    }

    .form-status.success { color: #27ae60; }
    .form-status.error   { color: #c0392b; }

    @media (max-width: 768px) {
      .contact-grid {
        grid-template-columns: 1fr;
        gap: 3rem;
        padding: 3rem 0;
      }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <nav>
      <a href="/" class="nav-logo">SmokeyAllen</a>
      <ul class="nav-links">
        <li><a href="about.html">About</a></li>
        <li><a href="transactions.html">Gambling Tracker</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </nav>
  </header>

  <!-- ===== PAGE HEADER ===== -->
  <div class="contact-header">
    <div class="container">
      <span class="eyebrow">Contact</span>
      <h1>Get in <em>touch</em></h1>
    </div>
  </div>

  <!-- ===== MAIN ===== -->
  <main>
    <div class="container">
      <div class="contact-grid">

        <!-- Right: contact form -->
        <div class="contact-form-wrap">
          <h2>Send a <em>message</em></h2>

          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your name" />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" placeholder="What's on your mind?"></textarea>
          </div>

          <button class="btn btn-dark" id="sendBtn" onclick="sendMessage()">
            Send message &nbsp;→
          </button>

          <div class="form-status" id="formStatus"></div>
        </div>

      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="container">
      <div class="footer-inner">
        <span class="footer-logo">SA</span>
        <ul class="footer-links">
          <li><a href="/">Home</a></li>
          <li><a href="transactions.html">Gambling Tracker</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
      <p class="footer-copy">© 2026 Smokey Allen. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // ── Dark mode ──
    const toggle = document.getElementById('themeToggle');
    const body   = document.body;
    if (localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      body.classList.add('dark');
    }
    toggle.addEventListener('click', () => {
      body.classList.toggle('dark');
      localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
    });

    // ── Form submit — uses mailto as fallback since no backend ──
    function sendMessage() {
      const name    = document.getElementById('name').value.trim();
      const email   = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();
      const status  = document.getElementById('formStatus');

      if (!name || !email || !message) {
        status.textContent  = 'Please fill in all fields.';
        status.className    = 'form-status error';
        status.style.display = '';
        return;
      }

      const subject = `Message from ${name} via smokeyallen.com`;
      const body    = `From: ${name} (${email})\n\n${message}`;
      window.location.href = `mailto:contact@smokeyallen.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }
  </script>
</body>
</html>
